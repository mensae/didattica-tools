<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting...</title>
  <script>
    window.location.replace(`./index.php${window.location.search}${window.location.hash}`);
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=./index.php" />
  </noscript>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0a0a0f;
      color: #edf1ff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    a {
      color: #9eb8ff;
    }
  </style>
</head>
<body>
  <p>Redirecting to the app. If nothing happens, open <a id="redirect-link" href="./index.php">index.php</a>.</p>
  <script>
    document.getElementById('redirect-link').href = `./index.php${window.location.search}${window.location.hash}`;
  </script>
</body>
</html>
